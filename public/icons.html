<!--
  Proto icon set.

  Drawn on one 24 grid with a 2 unit margin, so every glyph occupies the same
  optical box and none looks heavier than its neighbours. One stroke weight, one
  corner treatment, colour inherited from context.

  Two rules that matter at 14px, which is where most of these are actually seen:
  no detail smaller than about 2 units, because it turns to mush, and no glyph
  that relies on a fill to read, because these sit on white, on violet, and on a
  watercolour wash.

  Usage:  <svg class="i"><use href="#i-shield"/></svg>
-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>

  <!-- ── standing and verification ─────────────────────────────── -->

  <symbol id="i-shield" viewBox="0 0 24 24">
    <path d="M12 2.8 4.8 5.6v5.6c0 4.4 2.9 8.2 7.2 9.9 4.3-1.7 7.2-5.5 7.2-9.9V5.6z"/>
    <path d="m8.9 11.8 2.2 2.3 4-4.4"/>
  </symbol>

  <!-- a licence: a card with a seal, not a generic document -->
  <symbol id="i-licence" viewBox="0 0 24 24">
    <rect x="2.6" y="4.8" width="18.8" height="14.4" rx="2.4"/>
    <circle cx="8.2" cy="11" r="2.3"/>
    <path d="M4.9 16.6a3.9 3.9 0 0 1 6.6 0M14.4 9.8h4.2M14.4 13.4h4.2"/>
  </symbol>

  <!-- the register itself: a book of record -->
  <symbol id="i-register" viewBox="0 0 24 24">
    <path d="M4 4.6a1.8 1.8 0 0 1 1.8-1.8H19a1 1 0 0 1 1 1v14.4a1 1 0 0 1-1 1H5.8A1.8 1.8 0 0 0 4 21V4.6Z"/>
    <path d="M4 17.6a1.8 1.8 0 0 1 1.8-1.8H20"/>
    <path d="M8.4 7.6h7.2M8.4 11.2h4.8"/>
  </symbol>

  <symbol id="i-doc" viewBox="0 0 24 24">
    <path d="M13.6 2.8H7.2a1.8 1.8 0 0 0-1.8 1.8v14.8a1.8 1.8 0 0 0 1.8 1.8h9.6a1.8 1.8 0 0 0 1.8-1.8V7.6z"/>
    <path d="M13.6 2.8v3.9a1 1 0 0 0 1 1h3.8"/>
    <path d="M8.8 12.4h6.4M8.8 16h4.4"/>
  </symbol>

  <!-- ── people and places ─────────────────────────────────────── -->

  <!-- a crew, not a contacts list -->
  <symbol id="i-crew" viewBox="0 0 24 24">
    <circle cx="9.2" cy="8" r="3.2"/>
    <path d="M3.4 19.4a5.8 5.8 0 0 1 11.6 0"/>
    <path d="M16.4 5.2a3.2 3.2 0 0 1 0 5.6M17.6 13.4a5.8 5.8 0 0 1 3 5.2"/>
  </symbol>

  <!-- a site, with the massing of a building under construction -->
  <symbol id="i-site" viewBox="0 0 24 24">
    <path d="M3 20.6h18"/>
    <path d="M5.4 20.6V7.4a1.4 1.4 0 0 1 .9-1.3l5.2-2a1.4 1.4 0 0 1 1.9 1.3v15.2"/>
    <path d="M13.4 10.6h4.3a1.4 1.4 0 0 1 1.4 1.4v8.6"/>
    <path d="M8.2 9.4h1.8M8.2 13h1.8M15.6 14.2h1.6"/>
  </symbol>

  <symbol id="i-building" viewBox="0 0 24 24">
    <path d="M3 20.6h18"/>
    <path d="M5.4 20.6V7.4a1.4 1.4 0 0 1 .9-1.3l5.2-2a1.4 1.4 0 0 1 1.9 1.3v15.2"/>
    <path d="M13.4 10.6h4.3a1.4 1.4 0 0 1 1.4 1.4v8.6"/>
    <path d="M8.2 9.4h1.8M8.2 13h1.8"/>
  </symbol>

  <!-- ── time ──────────────────────────────────────────────────── -->

  <symbol id="i-clock" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.8V12l3.4 2"/>
  </symbol>

  <!-- the watch: a schedule that has been kept -->
  <symbol id="i-schedule" viewBox="0 0 24 24">
    <rect x="3.2" y="5" width="17.6" height="16" rx="2.4"/>
    <path d="M3.2 9.8h17.6M8 2.8v4M16 2.8v4"/>
    <path d="m9.4 15.2 1.9 1.9 3.5-3.9"/>
  </symbol>

  <!-- readings over time -->
  <symbol id="i-history" viewBox="0 0 24 24">
    <path d="M3.6 12a8.4 8.4 0 1 0 2.6-6.1"/>
    <path d="M3.4 4.4V10h5.6"/>
    <path d="M12 8.2V12l2.8 1.7"/>
  </symbol>

  <!-- ── state ─────────────────────────────────────────────────── -->

  <symbol id="i-check" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
    <path d="m8.2 12.2 2.5 2.5 5.1-5.4"/>
  </symbol>

  <symbol id="i-alert" viewBox="0 0 24 24">
    <path d="M10.6 3.8 2.9 17.3a1.6 1.6 0 0 0 1.4 2.4h15.4a1.6 1.6 0 0 0 1.4-2.4L13.4 3.8a1.6 1.6 0 0 0-2.8 0Z"/>
    <path d="M12 9.4v3.8"/>
    <circle cx="12" cy="16.6" r=".9" fill="currentColor" stroke="none"/>
  </symbol>

  <symbol id="i-pause" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/>
    <path d="M10.2 9.4v5.2M13.8 9.4v5.2"/>
  </symbol>

  <!-- ── navigation and actions ────────────────────────────────── -->

  <symbol id="i-grid" viewBox="0 0 24 24">
    <rect x="3.2" y="3.2" width="7.4" height="7.4" rx="2"/>
    <rect x="13.4" y="3.2" width="7.4" height="7.4" rx="2"/>
    <rect x="3.2" y="13.4" width="7.4" height="7.4" rx="2"/>
    <rect x="13.4" y="13.4" width="7.4" height="7.4" rx="2"/>
  </symbol>

  <symbol id="i-list" viewBox="0 0 24 24">
    <path d="M9.4 6.4h11M9.4 12h11M9.4 17.6h11"/>
    <path d="M4.2 6.4h.01M4.2 12h.01M4.2 17.6h.01" stroke-width="2.4"/>
  </symbol>

  <symbol id="i-mail" viewBox="0 0 24 24">
    <rect x="2.8" y="5" width="18.4" height="14" rx="2.4"/>
    <path d="m3.6 6.8 7.3 5.4a1.8 1.8 0 0 0 2.2 0l7.3-5.4"/>
  </symbol>

  <symbol id="i-send" viewBox="0 0 24 24">
    <path d="M20.8 3.2 10.4 13.6"/>
    <path d="M20.8 3.2 14.2 21l-3.8-7.4L3 9.8z"/>
  </symbol>

  <symbol id="i-search" viewBox="0 0 24 24">
    <circle cx="10.8" cy="10.8" r="6.8"/>
    <path d="m15.8 15.8 4.4 4.4"/>
  </symbol>

  <symbol id="i-sliders" viewBox="0 0 24 24">
    <path d="M3.4 7.4h5.2M13 7.4h7.6M3.4 16.6h8.8M17 16.6h3.6"/>
    <circle cx="10.8" cy="7.4" r="2.3"/>
    <circle cx="14.8" cy="16.6" r="2.3"/>
  </symbol>

  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4.4 12h14.4M13 6.2 18.8 12 13 17.8"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="m6.8 9.6 5.2 5.2 5.2-5.2"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="m6.6 6.6 10.8 10.8M17.4 6.6 6.6 17.4"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4.8v14.4M4.8 12h14.4"/></symbol>

  <symbol id="i-rotate" viewBox="0 0 24 24">
    <path d="M3.6 12a8.4 8.4 0 1 0 2.6-6.1"/><path d="M3.4 4.4V10h5.6"/>
  </symbol>

  <symbol id="i-skip" viewBox="0 0 24 24">
    <path d="M4.2 8.4h9.4a4.2 4.2 0 0 1 0 8.4H9.6"/>
    <path d="m12.2 13.8-2.8 3 2.8 2.8"/>
  </symbol>

  <symbol id="i-users" viewBox="0 0 24 24">
    <circle cx="9.2" cy="8" r="3.2"/>
    <path d="M3.4 19.4a5.8 5.8 0 0 1 11.6 0"/>
    <path d="M16.4 5.2a3.2 3.2 0 0 1 0 5.6M17.6 13.4a5.8 5.8 0 0 1 3 5.2"/>
  </symbol>

</defs></svg>
